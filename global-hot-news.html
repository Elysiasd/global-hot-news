  </script>
  <script>
    (function () {
      var STORAGE_THEME = "zhengdian-dianxun-theme";
      var STORAGE_WATCH = "zhengdian-dianxun-watch";
      var root = document.documentElement;
      var toggle = document.getElementById("theme-toggle");

      function systemTheme() {
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        toggle.textContent = theme === "dark" ? "切换浅色模式" : "切换深色模式";
      }
      var saved = localStorage.getItem(STORAGE_THEME);
      applyTheme(saved === "dark" || saved === "light" ? saved : systemTheme());
      toggle.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        localStorage.setItem(STORAGE_THEME, next);
        applyTheme(next);
      });
      if (window.matchMedia) {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
          if (!localStorage.getItem(STORAGE_THEME)) applyTheme(e.matches ? "dark" : "light");
        });
      }

      var raw = document.getElementById("news-data").textContent;
      var data = JSON.parse(raw);
      var stories = data.stories || [];
      var refreshSeconds = Number(data.refresh_seconds || 600);
      document.getElementById("updated-label").textContent = data.updated || "";
      document.getElementById("edition-label").textContent = data.edition_label || "";
      document.getElementById("edition-no").textContent = data.edition_no_label || "";

      var deadline = Date.now() + refreshSeconds * 1000;
      var countEl = document.getElementById("countdown");
      function tick() {
        var left = Math.max(0, Math.floor((deadline - Date.now()) / 1000));
        var m = String(Math.floor(left / 60)).padStart(2, "0");
        var s = String(left % 60).padStart(2, "0");
        countEl.textContent = m + ":" + s;
      }
      tick();
      setInterval(tick, 1000);

      function loadWatch() {
        try {
          var arr = JSON.parse(localStorage.getItem(STORAGE_WATCH) || "[]");
          return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
      }
      function saveWatch(ids) {
        localStorage.setItem(STORAGE_WATCH, JSON.stringify(ids));
      }
      var watched = loadWatch();

      var categories = ["我的关注", "全部", "理工科", "社会政治", "游戏", "其他"];
      var currentCat = "全部";
      var currentSort = "heat";
      var tabs = document.getElementById("tabs");
      var wire = document.getElementById("wire");

      function isChinese(text) {
        var s = String(text || "");
        var cjk = (s.match(/[\u4e00-\u9fff]/g) || []).length;
        var letters = (s.match(/[A-Za-z\u4e00-\u9fff]/g) || []).length;
        return letters > 0 && (cjk / letters) >= 0.45;
      }
      function originalOf(s) {
        return (s.headline_original && String(s.headline_original).trim()) || s.headline || "";
      }
      function showZhLine(s) {
        var orig = originalOf(s);
        var zh = s.headline || "";
        if (!zh) return false;
        if (orig.replace(/\s+/g, "") === zh.replace(/\s+/g, "")) return false;
        if (isChinese(orig)) return false;
        var lang = String(s.lang || "").toLowerCase();
        if (lang.indexOf("zh") === 0) return false;
        return true;
      }
      function countCat(cat) {
        if (cat === "全部") return stories.length;
        if (cat === "我的关注") return stories.filter(function (s) { return !!s.focus || watched.indexOf(s.id) >= 0; }).length;
        return stories.filter(function (s) { return s.category === cat; }).length;
      }
      function sortKey(story) {
        var iso = story.published_iso || story.published || "";
        var t;
        if (story.time_precision === "date") {
          t = Date.parse(String(iso).slice(0, 10) + "T23:59:59+08:00");
        } else {
          t = Date.parse(iso);
        }
        if (isNaN(t)) t = 0;
        if (currentSort === "time") return -t;
        return (-Number(story.heat || 0) * 1e15) - t;
      }
      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function heatMarks(n) {
        n = Number(n || 0);
        var s = "";
        for (var i = 1; i <= 5; i++) s += i <= n ? "●" : "○";
        return s + " " + n;
      }
      function shortTime(story) {
        var iso = story.published_iso || "";
        var d = Date.parse(iso);
        if (!isNaN(d)) {
          var dt = new Date(d);
          var pad = function (x) { return String(x).padStart(2, "0"); };
          // format in UTC+8
          var utc = d + (dt.getTimezoneOffset() * 60000);
          var cst = new Date(utc + 8 * 3600000);
          if (story.time_precision === "date") {
            return pad(cst.getMonth() + 1) + "/" + pad(cst.getDate());
          }
          return pad(cst.getMonth() + 1) + "/" + pad(cst.getDate()) + " " + pad(cst.getHours()) + ":" + pad(cst.getMinutes());
        }
        return story.published || "";
      }
      function visibleStories() {
        var list = stories.filter(function (s) {
          if (currentCat === "全部") return true;
          if (currentCat === "我的关注") return !!s.focus || watched.indexOf(s.id) >= 0;
          return s.category === currentCat;
        }).slice();
        list.sort(function (a, b) {
          var d = sortKey(a) - sortKey(b);
          if (d) return d;
          return String(b.published_iso || "").localeCompare(String(a.published_iso || ""));
        });
        return list;
      }
      function renderTabs() {
        tabs.innerHTML = categories.map(function (cat) {
          return '<button class="tab" type="button" role="tab" data-cat="' + cat +
            '" aria-selected="' + (cat === currentCat) + '">' + cat +
            '<span class="n">' + countCat(cat) + "</span></button>";
        }).join("");
      }
      function renderFlash() {
        var box = document.getElementById("flash");
        var list = document.getElementById("flash-list");
        var items = stories.filter(function (s) { return s.breaking; }).slice()
          .sort(function (a, b) { return sortKey(a) - sortKey(b); });
        if (!items.length) { box.hidden = true; return; }
        box.hidden = false;
        list.innerHTML = items.map(function (s) {
          var orig = originalOf(s);
          var zh = showZhLine(s) ? '<div class="zh">' + escapeHtml(s.headline) + "</div>" : "";
          return "<li><a href=\"" + escapeHtml(s.url) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" +
            "<div class=\"oh\">" + escapeHtml(orig) + "</div>" + zh +
            "<div class=\"bm\">" + escapeHtml(s.source || "") + " · " + escapeHtml(s.published || "") +
            "</div></a></li>";
        }).join("");
      }
      function renderWire() {
        var list = visibleStories();
        if (!list.length) {
          wire.innerHTML = currentCat === "我的关注"
            ? '<p class="empty-hint">尚未关注任何电讯。点击条目右侧星标，将其加入本机关注列表。</p>'
            : "";
          return;
        }
        wire.innerHTML = list.map(function (s) {
          var orig = originalOf(s);
          var zh = showZhLine(s) ? '<p class="zh">' + escapeHtml(s.headline) + "</p>" : "";
          var on = watched.indexOf(s.id) >= 0;
          return '<article class="dispatch" data-id="' + escapeHtml(s.id) + '">' +
            '<div class="stamp">' + escapeHtml(shortTime(s)) + "</div>" +
            '<div class="body">' +
            '<div class="row-meta"><span class="cat">' + escapeHtml(s.category || "") +
            '</span>' + (s.breaking ? '<span class="flag-breaking">突发</span>' : '') +
            '<span class="heat" title="热度">' + heatMarks(s.heat) + "</span></div>" +
            '<h2 class="oh"><a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener noreferrer">' +
            escapeHtml(orig) + "</a></h2>" + zh +
            '<p class="sum">' + escapeHtml(s.summary || "") + "</p>" +
            '<p class="src">' + escapeHtml(s.source || "") + " · " + escapeHtml(s.published || "") + "</p>" +
            "</div>" +
            '<button class="watch-btn" type="button" aria-pressed="' + on + '" aria-label="关注" title="关注">' +
            (on ? "★" : "☆") + "</button></article>";
        }).join("");
      }
      tabs.addEventListener("click", function (e) {
        var btn = e.target.closest(".tab");
        if (!btn) return;
        currentCat = btn.getAttribute("data-cat");
        renderTabs();
        renderWire();
      });
      document.querySelector(".sorts").addEventListener("click", function (e) {
        var btn = e.target.closest(".sort");
        if (!btn) return;
        currentSort = btn.getAttribute("data-sort");
        document.querySelectorAll(".sort").forEach(function (b) {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        renderFlash();
        renderWire();
      });
      wire.addEventListener("click", function (e) {
        var btn = e.target.closest(".watch-btn");
        if (!btn) return;
        var art = btn.closest(".dispatch");
        if (!art) return;
        var id = art.getAttribute("data-id");
        var i = watched.indexOf(id);
        if (i >= 0) watched.splice(i, 1);
        else watched.push(id);
        saveWatch(watched);
        renderTabs();
        renderWire();
      });
      renderTabs();
      renderFlash();
      renderWire();
    })();
  </script>
